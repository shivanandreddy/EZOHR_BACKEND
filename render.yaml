services:
  - type: web
    name: pern-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pern-postgres-db
          property: connectionString

databases:
  - name: pern-postgres-db
    databaseName: perndb
    user: postgres
    plan: free